services:
  - type: worker
    name: raposa-cacadora
    runtime: python

    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/.cache/ms-playwright playwright install chromium

    startCommand: python bot.py

    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright

      - key: TELEGRAM_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false

      - key: TELEGRAM_ADMIN_ID
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_KEY
        sync: false

      - key: MERCADOLIVRE_ACCESS_TOKEN
        sync: false

      - key: PRODUTOS_POR_CICLO
        value: "1"

      - key: INTERVALO_MINUTOS
        value: "20"

      - key: DESCONTO_MINIMO
        value: "30"

      - key: AVALIACAO_MINIMA
        value: "4.5"

      - key: VENDAS_MINIMAS
        value: "0"

      - key: COMISSAO_MINIMA
        value: "0"
        
