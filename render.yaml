services:
  - type: worker
    name: raposa-cacadora
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: python bot.py

    envVars:
      - key: TELEGRAM_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false

      - key: SHOPEE_APP_ID
        sync: false

      - key: SHOPEE_SECRET
        sync: false

      - key: PRODUTOS_POR_CICLO
        value: "1"

      - key: INTERVALO_MINUTOS
        value: "20"

      - key: DESCONTO_MINIMO
        value: "30"

      - key: AVALIACAO_MINIMA
        value: "4.5"

      - key: VENDAS_MINIMAS
        value: "0"

      - key: COMISSAO_MINIMA
        value: "0"


  - type: web
    name: raposa-cacadora-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web.py
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MANUS_API_KEY
        sync: false
      - key: MANUS_WEBHOOK_PUBLIC_KEY
        sync: false
      - key: MANUS_API_URL
        value: https://api.manus.ai
